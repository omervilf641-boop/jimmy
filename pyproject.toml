[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jimmy-agent"
version = "1.0.0"
description = "A personal AI agent that learns from you, remembers it, and can speak"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["ai", "agent", "claude", "assistant", "memory", "tts"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Jimmy's brain. Everything else he does is standard library.
dependencies = ["anthropic>=0.40.0"]

[project.optional-dependencies]
# His voice. Without it he runs fine and simply stays silent.
voice = ["edge-tts>=7.0.0"]

[project.scripts]
jimmy = "jimmy_agent.agent:main"

[project.urls]
Homepage = "https://github.com/omervilf641-boop/jimmy"

[tool.setuptools]
packages = ["jimmy_agent"]
